# Alembic (build plan 4.4). Run from backend/:  alembic upgrade heads
# The database address comes from DATABASE_URL (app.config), never from this file.

[alembic]
script_location = %(here)s/migrations
# Two branches: core (Ishmam) and applink (Arifin). Applink's first revision
# depends_on the core revision that creates `owner`.
# One path per line: the folder a teammate clones into may have a space in its name.
version_locations =
    %(here)s/migrations/versions/core
    %(here)s/migrations/versions/applink
path_separator = newline
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
