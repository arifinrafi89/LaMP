[project]
name = "lamp-copilot-backend"
version = "0.1.0"
description = "LaMP-Copilot API: deterministic engines and REST endpoints"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "scipy>=1.13",
    "openai>=1.60",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "pydantic-ai-slim[openai]>=2.57",
    # Day 0 additions (build plan 8.5)
    "alembic>=1.20",
    "httpx>=0.27",
    "PyJWT>=2.15",
    "cryptography>=50",
    "sentry-sdk>=3.0",
    "fpdf2>=2.9",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "schemathesis>=4.34", "time-machine>=3.6", "pytest-cov>=7.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
