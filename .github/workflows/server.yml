name: server

# The server's CI (build plan 8.3, 10.3, 4.4; A1.4), on every PR and every push to main:
#   - the secret scan over the whole history (gitleaks);
#   - the migrations on Postgres: up to every head, down one on each branch, and up again;
#   - the whole server suite on Postgres (TEST_DATABASE_URL), in replay and mock mode, so
#     SKIP LOCKED, the per-shop chain and the tenancy harness run where production does.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.28.0"

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --config deploy/gitleaks.toml --redact --verbose --exit-code 1 .

  postgres:
    name: migrations and tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lamp
          POSTGRES_PASSWORD: lamp
          POSTGRES_DB: lamp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: replay
      APPLINK_MODE: mock
      DEV_MODE: "true"
      TEST_DATABASE_URL: postgresql+psycopg://lamp:lamp@localhost:5432/lamp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: A database of its own for the migration check
        run: >-
          python -c "import psycopg;
          psycopg.connect('postgresql://lamp:lamp@localhost:5432/lamp_test', autocommit=True)
          .execute('CREATE DATABASE lamp_migrations')"
      - name: Migrations go up, down one on each branch, and up again
        env:
          DATABASE_URL: postgresql://lamp:lamp@localhost:5432/lamp_migrations
        run: |
          alembic upgrade heads
          alembic check
          alembic downgrade core@-1
          alembic upgrade heads
          alembic downgrade applink@-1
          alembic upgrade heads
      - name: The server suite on Postgres
        run: pytest -q
