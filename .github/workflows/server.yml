name: server

# Arifin's server CI (build plan 8.3). For now: the secret scan, on every PR and every
# push to main, over the whole history. The Postgres test run and the migration check
# (up, down, up) join this file once the migrations are on main; until then pytest.yml
# runs the tests.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.28.0"

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --config deploy/gitleaks.toml --redact --verbose --exit-code 1 .
