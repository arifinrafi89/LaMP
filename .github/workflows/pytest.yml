name: pytest

# The server's tests (plan I0.1): the copied LaMP.ai suite plus everything new.
# Replay mode, so no OpenAI calls. Arifin's server.yml (plan 8.3) replaces this
# with Postgres, migrations and gitleaks.

on:
  push:
    branches: [main]
    paths: ["backend/**", "tests/**", "seed/**", "eval/**", "scripts/**", "contracts/**", ".github/workflows/pytest.yml"]
  pull_request:
    paths: ["backend/**", "tests/**", "seed/**", "eval/**", "scripts/**", "contracts/**", ".github/workflows/pytest.yml"]
  workflow_dispatch:

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (replay)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
